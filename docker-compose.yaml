services:
   backend:
      build:
         context: ./backend
         dockerfile: Dockerfile.dev

      container_name: openforest-backend

      volumes:
         - ./backend/src:/app/src
         - ./backend/scripts:/app/scripts

      ports:
         - '${BACKEND_PORT}:8000'

      env_file:
         - .env

      depends_on:
         postgres:
            condition: service_healthy

         redis:
            condition: service_healthy

         minio:
            condition: service_healthy

      restart: unless-stopped

   postgres:
      image: postgres:17-alpine

      container_name: openforest-postgres

      environment:
         POSTGRES_DB: ${POSTGRES_DB}
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      ports:
         - '${POSTGRES_PORT}:5432'

      volumes:
         - postgres_data:/var/lib/postgresql/data

      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']

         interval: 10s

         timeout: 5s

         retries: 5

      restart: unless-stopped

   redis:
      image: redis:8-alpine

      container_name: openforest-redis

      ports:
         - '${REDIS_PORT}:6379'

      volumes:
         - redis_data:/data

      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']

         interval: 10s

         timeout: 5s

         retries: 5

      restart: unless-stopped

   minio:
      image: minio/minio

      container_name: openforest-minio

      command: server /data --console-address ":9001"

      environment:
         MINIO_ROOT_USER: ${MINIO_ROOT_USER}
         MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      ports:
         - '${MINIO_PORT}:9000'
         - '${MINIO_CONSOLE_PORT}:9001'

      volumes:
         - minio_data:/data

      healthcheck:
         test: ['CMD', 'mc', 'ready', 'local']

         interval: 10s

         timeout: 5s

         retries: 5

      restart: unless-stopped

   minio-init:
      image: minio/mc

      container_name: openforest-minio-init

      depends_on:
         minio:
            condition: service_healthy

      entrypoint: ['/bin/sh', '-c']

      command:
         - |
            mc alias set openforest http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
            mc mb --ignore-existing openforest/${MINIO_BUCKET}

      restart: 'no'

volumes:
   postgres_data:

   redis_data:

   minio_data:
