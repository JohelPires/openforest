services:
   backend:
      build:
         context: ./backend
         dockerfile: Dockerfile.dev

      container_name: openforest-backend

      volumes:
         - ./backend:/app

      ports:
         - '${BACKEND_PORT}:8000'

      env_file:
         - .env

      depends_on:
         postgres:
            condition: service_healthy

         redis:
            condition: service_healthy

      restart: unless-stopped

   postgres:
      image: postgres:17-alpine

      container_name: openforest-postgres

      environment:
         POSTGRES_DB: ${POSTGRES_DB}
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      ports:
         - '${POSTGRES_PORT}:5432'

      volumes:
         - postgres_data:/var/lib/postgresql/data

      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']

         interval: 10s

         timeout: 5s

         retries: 5

      restart: unless-stopped

   redis:
      image: redis:8-alpine

      container_name: openforest-redis

      ports:
         - '${REDIS_PORT}:6379'

      volumes:
         - redis_data:/data

      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']

         interval: 10s

         timeout: 5s

         retries: 5

      restart: unless-stopped

volumes:
   postgres_data:

   redis_data:
